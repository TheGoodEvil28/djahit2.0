<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Djahit - Riwayat</title>
    <link rel="icon" type="image/x-icon" href="../../frontend/assets/img/logo.svg">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="../assets/js/auth-guard.js"></script>
   <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'cream': '#E9E4D4',
                        'section-white' : '#F4F2E9',
                        'djahit-orange': '#E07A5F',
                        'text-dark': '#A85C47',
                        'button-green': '#7A8568',
                        'sage-green': '#8B9D6F',
                        'text-white': '#F6F7F3',
                        'text-radio': '#393E30',
                        'reminder': '#F5D6CD',
                        'font-sec': '#414141',
                        'button-diterima': '#E2E7DB',
                        'button-dalam': '#49503E'
                    },
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-cream font-sans">
    <div id="navbar-container"></div>
    <div class="px-4 sm:px-6 pt-8">
        <div class="max-w-7xl mx-auto">
            <div class="bg-section-white min-h-[620px] rounded-2xl p-4 sm:p-8">
                <h2 class="text-base sm:text-lg font-medium border-b border-[#A3B18A] pb-2 mx-2 sm:mx-6 text-button-green mb-6">Riwayat Pesanan Perbaikan</h2>
                <div id="loading" class="flex justify-center items-center h-64">
                    <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-button-green"></div>
                </div>
                <div id="error" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded mb-4">
                    <span id="error-message"></span>
                </div>
                <div id="empty-state" class="hidden text-center py-12">
                    <div class="text-gray-400 text-lg mb-2">Tidak ada data pesanan</div>
                    <div class="text-gray-500 text-sm">Belum ada pesanan perbaikan yang dibuat</div>
                </div>
                <div id="desktop-table" class="hidden lg:block overflow-x-auto">
                    <table class="w-full">
                        <thead>
                            <tr class="bg-[#7A8568] text-white">
                                <th class="px-6 py-4 text-left text-xs font-medium rounded-tl-2xl">Nama Pesanan</th>
                                <th class="px-6 py-4 text-left text-xs font-medium">Jenis Pakaian</th>
                                <th class="px-6 py-4 text-left text-xs font-medium">Total Pembayaran</th>
                                <th class="px-6 py-4 text-left text-xs font-medium">Tanggal Pemesanan</th>
                                <th class="px-6 py-4 text-center text-xs font-medium rounded-tr-2xl">Status</th>
                            </tr>
                        </thead>                        
                        <tbody id="desktop-table-body" class="divide-y divide-gray-200">
                        </tbody>
                    </table>
                </div>
                <div id="mobile-cards" class="lg:hidden space-y-4">
                </div>
            </div>
        </div>
    </div>
    <div id="footer-container"></div>
        <script type="module" src="../assets/js/riwayatorderv2.js"></script>
</body>
</html>
