<div>
    <div id="chat"></div>
    <input id="userMessage" type="text" placeholder="Ask about digital stitching..." />
    <button onclick="sendMessage()">Send</button>
</div>

<script>
async function sendMessage() {
    const messageInput = document.getElementById("userMessage");
    const message = messageInput.value;
    if (!message) return;

    const chatDiv = document.getElementById("chat");
    chatDiv.innerHTML += `<p><strong>You:</strong> ${message}</p>`;
    messageInput.value = "";

    try {
        const response = await fetch("https://6s3e7o4sw6.execute-api.us-east-1.amazonaws.com/prod/chatbot", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({ userMessage: message })
        });

        const data = await response.json();
        chatDiv.innerHTML += `<p><strong>Bot:</strong> ${data.reply}</p>`;
    } catch (err) {
        chatDiv.innerHTML += `<p><strong>Bot:</strong> Error connecting to chatbot.</p>`;
        console.error(err);
    }
}
</script>
