<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>YOLO API Test</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    #preview { max-width: 400px; margin-top: 20px; }
    #results { margin-top: 20px; white-space: pre-wrap; }
  </style>
</head>
<body>

<h1>YOLO API Test</h1>

<input type="file" id="fileInput" accept="image/*">
<button id="submitBtn">Predict</button>

<img id="preview" src="" alt="Image preview">

<div id="results"></div>

<script>
  const fileInput = document.getElementById('fileInput');
  const submitBtn = document.getElementById('submitBtn');
  const preview = document.getElementById('preview');
  const resultsDiv = document.getElementById('results');

  let selectedFile;

  fileInput.addEventListener('change', (e) => {
    selectedFile = e.target.files[0];
    if (selectedFile) {
      preview.src = URL.createObjectURL(selectedFile);
    }
  });

  submitBtn.addEventListener('click', async () => {
    if (!selectedFile) {
      alert('Please select an image first!');
      return;
    }

    const formData = new FormData();
    formData.append('file', selectedFile);

    try {
      const response = await fetch('http://djahit.andikanugra.my.id:8009/predict', {
        method: 'POST',
        body: formData
        });


      if (!response.ok) {
        throw new Error(`HTTP error! status: ${response.status}`);
      }

      const data = await response.json();
      resultsDiv.textContent = JSON.stringify(data, null, 2);
    } catch (err) {
      resultsDiv.textContent = 'Error: ' + err.message;
    }
  });
</script>

</body>
</html>
