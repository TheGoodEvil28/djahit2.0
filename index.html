<div>
    <div id="chat"></div>

    <!-- Choose use case -->
    <select id="useCase">
        <option value="chatbot">Chatbot</option>
        <option value="rekognition-analysis">Rekognition Analysis</option>
    </select>

    <!-- User input -->
    <textarea id="userMessage" placeholder="Enter message or Rekognition JSON"></textarea>
    <button onclick="sendMessage()">Send</button>
</div>

<script>
async function sendMessage() {
    const messageInput = document.getElementById("userMessage");
    const message = messageInput.value.trim();
    if (!message) return;

    const useCaseSelect = document.getElementById("useCase");
    const useCase = useCaseSelect.value;

    const chatDiv = document.getElementById("chat");
    chatDiv.innerHTML += `<p><strong>You [${useCase}]:</strong> ${message}</p>`;
    messageInput.value = "";

    // Prepare payload for Lambda
    let payload;
    if (useCase === "chatbot") {
        payload = { useCase: "chatbot", userMessage: message };
    } else if (useCase === "rekognition-analysis") {
        // Expecting user to paste JSON text
        try {
            const rekJson = JSON.parse(message);
            payload = { useCase: "rekognition-analysis", rekognitionJson: rekJson };
        } catch (e) {
            chatDiv.innerHTML += `<p><strong>Bot:</strong> Invalid JSON input for Rekognition analysis.</p>`;
            return;
        }
    }

    try {
        const response = await fetch("https://3nw62fvjhg.execute-api.us-east-1.amazonaws.com/prod", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(payload)
        });

        const data = await response.json();
        chatDiv.innerHTML += `<p><strong>Bot:</strong> ${data.reply}</p>`;
    } catch (err) {
        chatDiv.innerHTML += `<p><strong>Bot:</strong> Error connecting to Lambda.</p>`;
        console.error(err);
    }
}
</script>
