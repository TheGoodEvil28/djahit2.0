<!DOCTYPE html>
<html>
<head>
  <title>Reverse SSH Test</title>
</head>
<body>
  <h1>Hello from Private Server!</h1>
  <form id="userdata" action="/submit" method="POST">
    <input type="text" name="message" placeholder="Type something">
    <button type="submit">Send</button>
  </form>

  <script>
    document.getElementById('userdata').onsubmit = async (e) => {
      e.preventDefault();
      const data = { message: e.target.message.value };
      await fetch('/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      alert('Sent!');
    };
  </script>
</body>
</html>
