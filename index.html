<!DOCTYPE html>
<html>
<head>
    <title>Djahit Image Upload & Analysis</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .result-box { 
            margin-top: 20px; 
            padding: 15px; 
            border: 1px solid #ccc; 
            border-radius: 8px; 
        }
        img { 
            max-width: 300px; 
            margin-top: 10px; 
            border: 1px solid #ddd; 
            border-radius: 5px; 
        }
        table { 
            border-collapse: collapse; 
            margin-top: 10px; 
            width: 100%; 
        }
        th, td { 
            border: 1px solid #ddd; 
            padding: 8px; 
            text-align: left; 
        }
        th { 
            background: #f5f5f5; 
        }
    </style>
</head>
<body>
    <h2>Upload File</h2>
    <form id="uploadForm" enctype="multipart/form-data">
        <input type="file" name="file" id="fileInput" required>
        <button type="submit">Upload</button>
    </form>

    <div id="result" class="result-box" style="display:none;">
        <h3>Uploaded Image</h3>
        <img id="uploadedImage" src="" alt="Uploaded Image">
        
        <h3>Clothing Detected</h3>
        <table id="clothingTable" style="display:none;">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Confidence</th>
                    <th>Parents</th>
                    <th>Aliases</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <h3>Defects Detected</h3>
        <table id="defectsTable" style="display:none;">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Confidence</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        const form = document.getElementById('uploadForm');
        const resultBox = document.getElementById('result');
        const uploadedImage = document.getElementById('uploadedImage');
        const clothingTable = document.getElementById('clothingTable');
        const defectsTable = document.getElementById('defectsTable');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('fileInput');
            if (!fileInput.files.length) return alert('Select a file');

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            try {
                const res = await fetch('/upload', { method: 'POST', body: formData });
                const data = await res.json();

                // ✅ Use image_url from backend (pre-signed)
                uploadedImage.src = data.image_url;

                // ✅ Populate clothing table
                const clothingBody = clothingTable.querySelector('tbody');
                clothingBody.innerHTML = "";
                if (data.clothing && data.clothing.length > 0) {
                    clothingTable.style.display = 'table';
                    data.clothing.forEach(item => {
                        const row = `<tr>
                            <td>${item.Name}</td>
                            <td>${item.Confidence}%</td>
                            <td>${item.Parents.join(", ") || "-"}</td>
                            <td>${item.Aliases.join(", ") || "-"}</td>
                        </tr>`;
                        clothingBody.insertAdjacentHTML('beforeend', row);
                    });
                } else {
                    clothingTable.style.display = 'none';
                }

                // ✅ Populate defects table
                const defectsBody = defectsTable.querySelector('tbody');
                defectsBody.innerHTML = "";
                if (data.defects && data.defects.length > 0) {
                    defectsTable.style.display = 'table';
                    data.defects.forEach(item => {
                        const row = `<tr>
                            <td>${item.Name}</td>
                            <td>${item.Confidence}%</td>
                        </tr>`;
                        defectsBody.insertAdjacentHTML('beforeend', row);
                    });
                } else {
                    defectsTable.style.display = 'none';
                }

                // ✅ Show result box
                resultBox.style.display = 'block';

            } catch (err) {
                alert('Upload failed: ' + err);
            }
        });
    </script>
</body>
</html>
