<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Djahit Image Upload & Analysis</title>
  <style>
    body { font-family: Arial, sans-serif; padding:20px }
    .result-box{margin-top:20px;padding:15px;border:1px solid #ccc;border-radius:8px}
    img{max-width:300px;margin-top:10px;border:1px solid #ddd;border-radius:5px}
    table{border-collapse:collapse;margin-top:10px;width:100%}
    th,td{border:1px solid #ddd;padding:8px;text-align:left}
    th{background:#f5f5f5}
  </style>
</head>
<body>
  <h2>Upload File</h2>
  <form id="uploadForm">
    <input type="file" id="fileInput" accept="image/*" required>
    <button type="submit">Upload & Analyze</button>
  </form>

  <div id="result" class="result-box" style="display:none;">
    <h3>Uploaded Image</h3>
    <img id="uploadedImage" src="" alt="Uploaded Image">
    <h3>Clothing Detected</h3>
    <table id="clothingTable" style="display:none;"><thead><tr><th>Name</th><th>Confidence</th><th>Parents</th></tr></thead><tbody></tbody></table>
    <h3>Defects Detected</h3>
    <table id="defectsTable" style="display:none;"><thead><tr><th>Name</th><th>Confidence</th></tr></thead><tbody></tbody></table>
  </div>

  <script>
    const API_BASE = 'https://6s3e7o4sw6.execute-api.us-east-1.amazonaws.com/prod';

    const form = document.getElementById('uploadForm');
    const uploadedImage = document.getElementById('uploadedImage');
    const resultBox = document.getElementById('result');
    const clothingTable = document.getElementById('clothingTable');
    const defectsTable = document.getElementById('defectsTable');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const fileInput = document.getElementById('fileInput');
      if (!fileInput.files.length) return alert('Select a file');

      const file = fileInput.files[0];

      try {
        // 1) Generate presigned PUT URL
        const res1 = await fetch(API_BASE + '/generate-upload-url', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename: file.name, contentType: file.type })
        });
        if (!res1.ok) throw new Error('generate upload url failed: ' + res1.statusText);
        const { uploadUrl, key } = await res1.json();

        // 2) Upload file to S3
        const putRes = await fetch(uploadUrl, {
          method: 'PUT',
          body: file,
          headers: { 'Content-Type': file.type }
        });
        if (!putRes.ok) throw new Error('upload failed: ' + putRes.statusText);

        // 3) Analyze image
        const res2 = await fetch(API_BASE + '/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key })
        });
        if (!res2.ok) throw new Error('analyze failed: ' + res2.statusText);
        const data = await res2.json();

        // 4) Display image and results
        uploadedImage.src = `https://djahit-image-upload-bucket.s3.us-east-1.amazonaws.com/${encodeURIComponent(key)}`;
        resultBox.style.display = 'block';

        // Clothing
        const clothingBody = clothingTable.querySelector('tbody');
        clothingBody.innerHTML = '';
        if (data.clothing && data.clothing.length) {
          clothingTable.style.display = 'table';
          data.clothing.forEach(item => {
            const parents = (item.Parents || []).map(p=>p.Name).join(', ') || '-';
            clothingBody.insertAdjacentHTML('beforeend',
              `<tr><td>${item.Name}</td><td>${item.Confidence.toFixed(1)}%</td><td>${parents}</td></tr>`);
          });
        } else clothingTable.style.display = 'none';

        // Defects
        const defectsBody = defectsTable.querySelector('tbody');
        defectsBody.innerHTML = '';
        if (data.defects && data.defects.length) {
          defectsTable.style.display = 'table';
          data.defects.forEach(item => {
            defectsBody.insertAdjacentHTML('beforeend', `<tr><td>${item.Name}</td><td>${item.Confidence.toFixed(1)}%</td></tr>`);
          });
        } else defectsTable.style.display = 'none';

      } catch (err) {
        alert('Error: ' + (err.message || err));
        console.error(err);
      }
    });
  </script>
</body>
</html>
