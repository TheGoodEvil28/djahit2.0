<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Djahit Image Upload & Analysis</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f7f8fa;
      color: #333;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    #uploadForm {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    #fileInput {
      padding: 8px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      background-color: #007BFF;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background-color: #0056b3;
    }

    .loading {
      text-align: center;
      margin-bottom: 20px;
      font-weight: bold;
      color: #007BFF;
      display: none;
    }

    .result-box {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 3px 10px rgba(0,0,0,0.1);
      max-width: 800px;
      margin: 0 auto 30px auto;
      display: none;
    }

    img {
      max-width: 100%;
      border-radius: 8px;
      border: 1px solid #ddd;
      margin-bottom: 15px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 10px;
      font-size: 0.95em;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
    }

    th {
      background: #f0f0f0;
    }

    tr:hover {
      background: #f9f9f9;
    }

    @media (max-width: 600px) {
      #uploadForm {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

<h2>Djahit Image Upload & Analysis</h2>

<form id="uploadForm">
  <input type="file" id="fileInput" accept="image/*" required>
  <button type="submit">Upload & Analyze</button>
</form>

<div class="loading" id="loading">Processing...</div>

<div id="result" class="result-box">
  <h3>Uploaded Image</h3>
  <img id="uploadedImage" src="" alt="Uploaded Image">

  <h3>Clothing Detected</h3>
  <table id="clothingTable">
    <thead><tr><th>Name</th><th>Confidence</th><th>Parents</th></tr></thead>
    <tbody></tbody>
  </table>

  <h3>Defects Detected</h3>
  <table id="defectsTable">
    <thead><tr><th>Name</th><th>Confidence</th></tr></thead>
    <tbody></tbody>
  </table>
</div>

<script>
const API_BASE = 'https://6s3e7o4sw6.execute-api.us-east-1.amazonaws.com/prod';

const form = document.getElementById('uploadForm');
const uploadedImage = document.getElementById('uploadedImage');
const resultBox = document.getElementById('result');
const clothingTable = document.getElementById('clothingTable');
const defectsTable = document.getElementById('defectsTable');
const loading = document.getElementById('loading');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const fileInput = document.getElementById('fileInput');
  if (!fileInput.files.length) return alert('Select a file');

  const file = fileInput.files[0];
  loading.style.display = 'block';
  resultBox.style.display = 'none';

  try {
    // 1) Generate presigned PUT URL
    const res1 = await fetch(`${API_BASE}/generate-upload-url`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ filename: file.name, contentType: file.type })
    });
    if (!res1.ok) throw new Error('Failed to generate upload URL');
    const { uploadUrl, key } = await res1.json();

    // 2) Upload to S3
    const putRes = await fetch(uploadUrl, {
      method: 'PUT',
      body: file,
      headers: { 'Content-Type': file.type, 'Cache-Control': 'no-cache' }
    });
    if (!putRes.ok) throw new Error('Upload failed');

    // 3) Analyze uploaded image
    const res2 = await fetch(`${API_BASE}/analyze`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key })
    });
    if (!res2.ok) throw new Error('Analyze failed');
    const data = await res2.json();

    // 4) Display uploaded image directly from S3
    uploadedImage.src = `https://djahit-image-upload-bucket.s3.us-east-1.amazonaws.com/${encodeURIComponent(key)}?t=${Date.now()}`;
    resultBox.style.display = 'block';

    // Populate clothing table
    const clothingBody = clothingTable.querySelector('tbody');
    clothingBody.innerHTML = '';
    if (data.clothing?.length) {
      clothingTable.style.display = 'table';
      data.clothing.forEach(item => {
        const parents = (item.Parents || []).map(p => p.Name).join(', ') || '-';
        clothingBody.insertAdjacentHTML('beforeend',
          `<tr><td>${item.Name}</td><td>${item.Confidence.toFixed(1)}%</td><td>${parents}</td></tr>`);
      });
    } else clothingTable.style.display = 'none';

    // Populate defects table
    const defectsBody = defectsTable.querySelector('tbody');
    defectsBody.innerHTML = '';
    if (data.defects?.length) {
      defectsTable.style.display = 'table';
      data.defects.forEach(item => {
        defectsBody.insertAdjacentHTML('beforeend',
          `<tr><td>${item.Name}</td><td>${item.Confidence.toFixed(1)}%</td></tr>`);
      });
    } else defectsTable.style.display = 'none';

  } catch (err) {
    alert('Error: ' + (err.message || err));
    console.error(err);
  } finally {
    loading.style.display = 'none';
  }
});
</script>


</body>
</html>
